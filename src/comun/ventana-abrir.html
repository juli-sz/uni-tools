<div class="overlay" id="ov-io"><div class="modal">
  <h2>{{titulo}}</h2>
  <p class="sub">Un <b>.json</b> guardado desde acá, o un <b>.svg</b> exportado desde acá:
    el SVG se lleva los datos del {{cosa}} adentro, así que se puede volver a abrir y editar.</p>
  <div class="filebox">
    <button class="btn on" id="io-file-btn">Elegir archivo…</button>
    <span class="nom" id="io-file-nom">Ningún archivo elegido</span>
  </div>
  <input type="file" id="io-file" accept=".json,.svg,application/json,image/svg+xml" hidden>
  <details>
    <summary>o pegar el JSON a mano</summary>
    <textarea id="io-text" spellcheck="false" placeholder='{ "{{nodos}}": [...], "{{conexiones}}": [...] }'></textarea>
  </details>
  <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="io-cancel">Cancelar</button>
    <button class="btn on" id="io-ok">Cargar lo pegado</button>
  </div>
</div></div>
