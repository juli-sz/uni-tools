<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lugar geométrico de las raíces</title>
<meta name="description" content="Calculadora del LGR: ingresá la ecuación o los ceros y polos y obtené el gráfico con todos los cálculos paso a paso">
<link rel="icon" type="image/png" href="uni-tools-marca.png">
<style>
:root{
  --ink:#12181f;
  --ink-2:#3d4b5a;
  --line:#d7dee6;
  --line-2:#eef2f6;
  --paper:#ffffff;
  --shell:#f2f5f8;
  --accent:#0d5bd6;
  --accent-soft:#e3edff;
  --warn:#c2410c;
  --ok:#166534;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  --draw:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);background:var(--shell);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
/* ---------- barra de arriba ---------- */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 14px;
  background:var(--paper);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-size:14px;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;color:#8a97a5;letter-spacing:.08em;text-transform:uppercase}
.group{display:flex;align-items:center;gap:4px;padding-right:12px;border-right:1px solid var(--line-2)}
.group:last-child{border-right:0}
.glab{font-family:var(--mono);font-size:9px;color:#93a0ae;letter-spacing:.1em;text-transform:uppercase;
  margin-right:2px;cursor:pointer;user-select:none;transition:color .15s}
.glab:hover{color:var(--ink)}
.glab::after{content:" \25BC";font-size:8px;opacity:.6;display:inline-block;
  transition:transform .2s;margin-left:4px}
.group.collapsed .glab::after{transform:rotate(-90deg)}
.group.collapsed > *:not(.glab){display:none !important}
button,select,input[type=text]{font-family:var(--ui);font-size:12px;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 9px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;line-height:1;white-space:nowrap;
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--line-2)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:14px;height:14px;stroke:var(--ink-2);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.btn.on svg{stroke:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 6px;max-width:230px}
.marca-navbar{height:26px;width:auto;display:block;flex:none}
/* ---------- entrada de datos ---------- */
#entrada{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;z-index:4}
#entrada .fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#entrada[hidden],#entrada .fila[hidden]{display:none}
.eq{font-family:var(--draw);font-size:17px;white-space:nowrap}
.frac-in{display:inline-flex;flex-direction:column;align-items:stretch;gap:0}
.frac-in hr{border:0;border-top:1.5px solid var(--ink);margin:3px 0}
.entrada-txt{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;width:min(330px,70vw);background:var(--paper);outline:none;text-align:center}
.entrada-txt:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.entrada-txt.mal{border-color:var(--warn)}
.etq{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7b8896}
#resumen{font-size:12.5px;color:var(--ink-2);flex:1;min-width:260px;line-height:1.6}
#resumen b{color:var(--ink);font-weight:600}
#msj{flex-basis:100%;font-size:12.5px;color:var(--warn);display:none}
#msj.on{display:block}
#msj .btn{margin-left:8px;padding:3px 8px}
.nota-info{color:var(--ink-2)}
/* ---------- estructura ---------- */
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;background:var(--paper);overflow:hidden;min-width:0}
svg#canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;user-select:none}
svg#canvas.arrastrando{cursor:grabbing}
#zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 6px 24px rgba(18,24,31,.08)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-family:var(--mono);
  font-size:11px;padding:4px 7px;border-radius:5px;white-space:nowrap;display:none;z-index:3}
#leyenda{position:absolute;right:12px;top:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;font-size:11px;color:var(--ink-2);line-height:1.7;pointer-events:none}
#leyenda svg{width:16px;height:12px;vertical-align:-2px;margin-right:5px;overflow:visible}
#vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a97a5;
  font-size:14px;pointer-events:none;text-align:center;padding:20px}
/* ---------- panel de detalles ---------- */
#detalles{width:460px;flex:none;background:var(--paper);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  transition:width .2s ease,min-width .2s ease,border-color .2s ease}
#detalles.collapsed{width:0;min-width:0;border-left-color:transparent;overflow:hidden}
#det-barra{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-2);flex:none}
#det-barra .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7b8896;margin-right:auto}
#det-cuerpo{overflow-y:auto;overflow-x:hidden;flex:1;padding:6px 0 30px}
details.paso{border-bottom:1px solid var(--line-2)}
details.paso>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:9px;user-select:none}
details.paso>summary::-webkit-details-marker{display:none}
details.paso>summary:hover{background:#f7f9fb}
details.paso>summary::after{content:"\25BE";margin-left:auto;color:#93a0ae;transition:transform .2s}
details.paso:not([open])>summary::after{transform:rotate(-90deg)}
.num{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-family:var(--mono);font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cuerpo{padding:2px 14px 14px;font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.cuerpo p{margin:6px 0}
.cuerpo b{color:var(--ink)}
.ec{font-family:var(--draw);font-size:15px;color:var(--ink);background:#f7f9fb;border:1px solid var(--line-2);
  border-radius:6px;padding:7px 10px;margin:6px 0;overflow-x:auto;white-space:nowrap}
.ec.sm{font-size:13.5px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 4px 1px}
.fr>span:last-child{padding:1px 4px 0}
table.t{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
table.t th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#7b8896;
  text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:4px 6px;border-bottom:1px solid var(--line-2);font-family:var(--draw);color:var(--ink)}
.si{color:var(--ok);font-weight:600}
.no{color:var(--warn);font-weight:600}
.res{border-left:3px solid var(--accent);background:var(--accent-soft);padding:6px 10px;margin:8px 0;
  border-radius:0 6px 6px 0;color:var(--ink)}
.res.no-res{border-left-color:var(--warn);background:#fff1ea}
pre.cod{background:#12181f;color:#e6edf3;border-radius:6px;padding:9px 11px;font-family:var(--mono);
  font-size:11.5px;overflow-x:auto;margin:6px 0;line-height:1.55}
.vacio-det{padding:30px 20px;color:#8a97a5;font-size:13px;text-align:center}
@media (max-width:820px){
  #detalles{position:absolute;top:0;right:0;bottom:0;z-index:6;width:min(430px,92vw);
    box-shadow:-8px 0 24px rgba(18,24,31,.14)}
  #detalles.collapsed{box-shadow:none}
  #leyenda{display:none}
}
</style>
</head>
<body>

<header>
  <a href="index.html" title="Volver al inicio"><img class="marca-navbar" src="uni-tools-marca.png" alt="uni-tools"></a>
  <div class="brand"><b>Lugar geométrico de las raíces</b><span>LGR</span></div>

  <div class="group" id="g-datos">
    <span class="glab">Datos</span>
    <button class="btn on" id="m-ec" title="Se ingresa N(s) y D(s): se calculan ceros y polos">Desde la ecuación</button>
    <button class="btn" id="m-zp" title="Se ingresan los ceros y los polos de lazo abierto">Desde ceros y polos</button>
    <select id="ejemplos" title="Cargar un ejercicio de las guías"></select>
  </div>

  <div class="group" id="g-graf">
    <span class="glab">Gráfico</span>
    <button class="btn on" id="v-asint" title="Asíntotas y su punto de origen">Asíntotas</button>
    <button class="btn on" id="v-vals" title="Valores calculados sobre el gráfico">Valores</button>
    <button class="btn on" id="v-flechas" title="Sentido en que crece K">Flechas</button>
    <button class="btn on" id="v-grid" title="Cuadrícula">Cuadrícula</button>
    <button class="btn" id="b-ajustar" title="Encuadrar el gráfico">Encuadrar</button>
  </div>

  <div class="group" id="g-exp">
    <span class="glab">Exportar</span>
    <button class="btn" id="e-svg">SVG</button>
    <button class="btn" id="e-png">PNG</button>
  </div>

  <div class="group">
    <button class="btn on" id="b-det" title="Mostrar u ocultar los cálculos paso a paso">Detalles</button>
  </div>
</header>

<section id="entrada">
  <div class="fila" id="f-ec">
    <span class="eq">1 + K&nbsp;·</span>
    <span class="frac-in">
      <input class="entrada-txt" id="i-N" type="text" spellcheck="false" autocomplete="off" placeholder="N(s)   ej.: s + 4,5">
      <hr>
      <input class="entrada-txt" id="i-D" type="text" spellcheck="false" autocomplete="off" placeholder="D(s)   ej.: s^2 + 6s + 45">
    </span>
    <span class="eq">= 0</span>
  </div>
  <div class="fila" id="f-zp" hidden>
    <span class="etq">Ceros</span>
    <input class="entrada-txt" id="i-Z" type="text" spellcheck="false" autocomplete="off" placeholder="ej.: 1+2j; 1-2j; -3">
    <span class="etq">Polos</span>
    <input class="entrada-txt" id="i-P" type="text" spellcheck="false" autocomplete="off" placeholder="ej.: 4; -2+3j; -2-3j; -2">
  </div>
  <div id="resumen"></div>
  <div id="msj"></div>
</section>

<main>
  <div id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="vacio">Ingresá la función para ver el lugar geométrico</div>
    <div id="leyenda"></div>
    <div id="zoom">
      <button class="btn ghost" id="z-mas" title="Acercar">+</button>
      <button class="btn ghost" id="z-menos" title="Alejar">&minus;</button>
    </div>
    <div id="tip"></div>
  </div>
  <aside id="detalles">
    <div id="det-barra">
      <span class="t">Cálculos paso a paso</span>
      <button class="btn ghost" id="d-abrir" title="Expandir todos los pasos">Abrir todo</button>
      <button class="btn ghost" id="d-cerrar" title="Contraer todos los pasos">Cerrar todo</button>
    </div>
    <div id="det-cuerpo"></div>
  </aside>
</main>

<script>
/* =====================================================================
   MATEMÁTICA
   Los polinomios son arreglos de coeficientes reales en potencias
   descendentes (como en MatLab): [1, 6, 45] es s² + 6s + 45.
   Los complejos son objetos {re, im}.
   ===================================================================== */
const C = (re, im = 0) => ({ re, im });
const cAbs = z => Math.hypot(z.re, z.im);
const cSub = (a, b) => C(a.re - b.re, a.im - b.im);
const cMul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
const cDiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };

function pTrim(p, tol = 1e-12) {
  const mx = Math.max(...p.map(Math.abs));
  if (!(mx > 0)) return [0];
  let i = 0;
  while (i < p.length - 1 && Math.abs(p[i]) <= tol * mx) i++;
  return p.slice(i);
}
function pAdd(a, b) {
  const n = Math.max(a.length, b.length), r = new Array(n).fill(0);
  a.forEach((c, i) => r[n - a.length + i] += c);
  b.forEach((c, i) => r[n - b.length + i] += c);
  return r;
}
const pScale = (p, k) => p.map(c => c * k);
function pMul(a, b) {
  const r = new Array(a.length + b.length - 1).fill(0);
  for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) r[i + j] += a[i] * b[j];
  return r;
}
function pDer(p) {
  const g = p.length - 1;
  return g < 1 ? [0] : p.slice(0, g).map((c, i) => c * (g - i));
}
function pEval(p, z) {
  let r = C(0, 0);
  for (const c of p) { r = cMul(r, z); r.re += c; }
  return r;
}
function pDesdeRaices(rs) {
  let p = [C(1, 0)];
  for (const r of rs) {
    const q = new Array(p.length + 1).fill(0).map(() => C(0, 0));
    p.forEach((c, i) => {
      q[i].re += c.re; q[i].im += c.im;
      const t = cMul(c, r);
      q[i + 1].re -= t.re; q[i + 1].im -= t.im;
    });
    p = q;
  }
  return p.map(c => c.re);
}

/* Raíces por el método de Aberth. `ini` permite arrancar de una estimación previa. */
function raicesPoli(p, ini) {
  p = pTrim(p);
  const d = p.length - 1;
  if (d < 1) return [];
  const mx = Math.max(...p.map(Math.abs));
  let ceros = 0;
  while (ceros < d && Math.abs(p[d - ceros]) <= 1e-14 * mx) ceros++;
  const out = [];
  for (let i = 0; i < ceros; i++) out.push(C(0, 0));
  const q = p.slice(0, d + 1 - ceros), g = q.length - 1;
  if (g < 1) return out;
  const a = q.map(c => c / q[0]);
  let z;
  if (ini && ini.length === g) {
    // un arranque exactamente real nunca saldría del eje: se lo corre un poco en imaginario
    z = ini.map((c, i) => ({ re: c.re, im: Math.abs(c.im) < 1e-12 ? (i % 2 ? 1 : -1) * 1e-6 * (1 + Math.abs(c.re)) : c.im }));
  }
  else {
    const r0 = Math.max(1e-6, Math.pow(Math.abs(a[g]), 1 / g));
    z = [];
    for (let k = 0; k < g; k++) z.push({ re: r0 * Math.cos(2 * Math.PI * k / g + 0.4), im: r0 * Math.sin(2 * Math.PI * k / g + 0.4) });
  }
  const maxIt = ini ? 80 : 500;
  for (let it = 0; it < maxIt; it++) {
    let maxd = 0;
    for (let i = 0; i < g; i++) {
      const zr = z[i].re, zi = z[i].im;
      let pr = a[0], pi = 0, dr = 0, di = 0;
      for (let k = 1; k <= g; k++) {
        const ndr = dr * zr - di * zi + pr, ndi = dr * zi + di * zr + pi;
        const npr = pr * zr - pi * zi + a[k], npi = pr * zi + pi * zr;
        dr = ndr; di = ndi; pr = npr; pi = npi;
      }
      if (pr === 0 && pi === 0) continue;
      const den = dr * dr + di * di;
      let wr, wi;
      if (den === 0) { wr = 1e-8; wi = 1e-8; }
      else { wr = (pr * dr + pi * di) / den; wi = (pi * dr - pr * di) / den; }
      let sr = 0, si = 0;
      for (let j = 0; j < g; j++) {
        if (j === i) continue;
        const xr = zr - z[j].re, xi = zi - z[j].im, dd = xr * xr + xi * xi || 1e-300;
        sr += xr / dd; si -= xi / dd;
      }
      const br = 1 - (wr * sr - wi * si), bi = -(wr * si + wi * sr), bb = br * br + bi * bi || 1e-300;
      const er = (wr * br + wi * bi) / bb, ei = (wi * br - wr * bi) / bb;
      z[i].re -= er; z[i].im -= ei;
      maxd = Math.max(maxd, Math.hypot(er, ei) / (1 + Math.hypot(z[i].re, z[i].im)));
    }
    if (maxd < 1e-13) break;
  }
  return out.concat(z.map(c => C(c.re, c.im)));
}
function limpiar(rs) {
  return rs.map(z => {
    const t = 1e-7 * Math.max(1, cAbs(z));
    return C(Math.abs(z.re) < t ? 0 : z.re, Math.abs(z.im) < t ? 0 : z.im);
  }).sort((a, b) => b.re - a.re || b.im - a.im);
}
/* Junta raíces repetidas: [{z, mult}] */
function agrupar(rs, tolRel = 5e-5) {
  const gs = [];
  for (const z of rs) {
    const g = gs.find(g => cAbs(cSub(g.z, z)) <= tolRel * (1 + cAbs(z)));
    if (g) { g.sum = C(g.sum.re + z.re, g.sum.im + z.im); g.mult++; g.z = C(g.sum.re / g.mult, g.sum.im / g.mult); }
    else gs.push({ z: C(z.re, z.im), mult: 1, sum: C(z.re, z.im) });
  }
  return gs.map(g => ({ z: limpiar([g.z])[0], mult: g.mult })).sort((a, b) => b.z.re - a.z.re || b.z.im - a.z.im);
}
const expandir = gs => gs.flatMap(g => Array.from({ length: g.mult }, () => g.z));

/* ---------- lectura de lo que escribe el usuario ---------- */
function parsearComplejo(t) {
  t = t.replace(/[−–]/g, '-').replace(/\s+/g, '');
  const m = t.match(/[+-]?[^+-]+/g);
  if (!m || m.join('') !== t) return null;
  let re = 0, im = 0;
  for (const x of m) {
    if (/[ji]$/i.test(x)) {
      const c = x.slice(0, -1);
      if (!/^[+-]?(\d+\.?\d*|\.\d+)?$/.test(c)) return null;
      im += c === '' || c === '+' ? 1 : c === '-' ? -1 : parseFloat(c);
    } else {
      if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(x)) return null;
      re += parseFloat(x);
    }
  }
  return C(re, im);
}
function parsearLista(txt) {
  let t = txt.replace(/[−–]/g, '-').replace(/[\[\]]/g, ' ');
  if (/^\s*(no\s+existen?|ninguno|ninguna|-|—)?\s*$/i.test(t)) return [];
  t = t.replace(/(\d),(\d)/g, '$1.$2');
  t = t.replace(/(\d|\.)\s*([+-])\s*((?:\d+\.?\d*|\.\d+)?[ji])(?![\w.])/gi, '$1$2$3');
  return t.split(/[;,\s]+/).filter(Boolean).map(x => {
    const z = parsearComplejo(x);
    if (!z) throw new Error('No entiendo «' + x + '». Usá, por ejemplo, 2; -3,5; -2+3j');
    return z;
  });
}
function parsearPoli(txt) {
  let t = txt.replace(/[−–]/g, '-').replace(/[·×]/g, '*').replace(/(\d),(\d)/g, '$1.$2')
    .replace(/[²³⁴⁵⁶⁷⁸⁹]/g, c => '^' + (2 + '²³⁴⁵⁶⁷⁸⁹'.indexOf(c))).trim();
  if (!t) throw new Error('Falta completar el polinomio');
  if (t[0] === '[') {
    const v = t.replace(/[\[\]]/g, ' ').split(/[\s;,]+/).filter(Boolean).map(Number);
    if (!v.length || v.some(isNaN)) throw new Error('El vector de coeficientes no es válido');
    return pTrim(v);
  }
  const tok = [], re = /(\d+\.?\d*|\.\d+|[sSkK]|[()+\-*\/^])/y;
  let i = 0;
  while (i < t.length) {
    if (/\s/.test(t[i])) { i++; continue; }
    re.lastIndex = i;
    const m = re.exec(t);
    if (!m) throw new Error('Carácter no válido: «' + t[i] + '»');
    tok.push(m[1]); i = re.lastIndex;
  }
  let p = 0;
  const peek = () => tok[p];
  function atomo() {
    const x = tok[p++];
    if (x === undefined) throw new Error('La expresión está incompleta');
    if (x === '(') { const r = expr(); if (tok[p++] !== ')') throw new Error('Falta cerrar un paréntesis'); return r; }
    if (/^[sS]$/.test(x)) return [1, 0];
    if (/^[kK]$/.test(x)) return [1];
    if (/^[\d.]/.test(x)) return [parseFloat(x)];
    throw new Error('No se esperaba «' + x + '»');
  }
  function potencia() {
    let b = atomo();
    if (peek() === '^') {
      p++;
      const e = tok[p++];
      if (!e || !/^\d+$/.test(e)) throw new Error('El exponente debe ser un entero positivo');
      let r = [1];
      for (let k = 0; k < +e; k++) r = pMul(r, b);
      b = r;
    }
    return b;
  }
  function unario() {
    if (peek() === '-') { p++; return pScale(unario(), -1); }
    if (peek() === '+') { p++; return unario(); }
    return potencia();
  }
  function term() {
    let r = unario();
    for (;;) {
      const x = peek();
      if (x === '*') { p++; r = pMul(r, unario()); }
      else if (x === '/') {
        p++;
        const q = pTrim(unario());
        if (q.length > 1) throw new Error('Sólo se puede dividir por un número: usá N(s) y D(s) por separado');
        r = pScale(r, 1 / q[0]);
      } else if (x !== undefined && /^[\d.sSkK(]/.test(x)) r = pMul(r, potencia());
      else break;
    }
    return r;
  }
  function expr() {
    let r = term();
    while (peek() === '+' || peek() === '-') {
      const o = tok[p++], q = term();
      r = pAdd(r, o === '+' ? q : pScale(q, -1));
    }
    return r;
  }
  const r = expr();
  if (p < tok.length) throw new Error('Sobra «' + tok[p] + '» en la expresión');
  return pTrim(r);
}

/* ---------- formato ---------- */
function fnum(x, d = 4) {
  if (!isFinite(x)) return x > 0 ? '∞' : x < 0 ? '−∞' : 'NaN';
  let s = (+x).toFixed(d);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return s.replace('-', '−').replace('.', ',');
}
function fcomp(z, d = 4) {
  const t = 1e-9 * Math.max(1, Math.abs(z.re), Math.abs(z.im));
  const re = Math.abs(z.re) < t ? 0 : z.re, im = Math.abs(z.im) < t ? 0 : z.im;
  if (im === 0) return fnum(re, d);
  const ims = (Math.abs(Math.abs(im) - 1) < 1e-12 ? '' : fnum(Math.abs(im), d)) + 'j';
  if (re === 0) return (im < 0 ? '−' : '') + ims;
  return fnum(re, d) + (im < 0 ? ' − ' : ' + ') + ims;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sup = e => e === 1 ? '' : '<sup>' + e + '</sup>';
function polyHTML(p, v = 's') {
  p = pTrim(p);
  const g = p.length - 1;
  let out = '';
  p.forEach((c, i) => {
    if (Math.abs(c) < 1e-12) return;
    const e = g - i, a = Math.abs(c);
    const coef = (Math.abs(a - 1) < 1e-12 && e > 0) ? '' : fnum(a);
    const parte = coef + (e === 0 ? '' : v + sup(e));
    if (!out) out = (c < 0 ? '−' : '') + parte;
    else out += (c < 0 ? ' − ' : ' + ') + parte;
  });
  return out || '0';
}
const fr = (a, b) => '<span class="fr"><span>' + a + '</span><span>' + b + '</span></span>';
function factorHTML(r, v = 's') {
  if (Math.abs(r.im) < 1e-12) {
    if (Math.abs(r.re) < 1e-12) return v;
    return '(' + v + (r.re < 0 ? ' + ' : ' − ') + fnum(Math.abs(r.re)) + ')';
  }
  return '(' + v + ' − (' + fcomp(r) + '))';
}
function factoresSimples(gs) {
  if (!gs.length) return '1';
  return gs.flatMap(g => Array.from({ length: g.mult }, () => factorHTML(g.z))).join('');
}
function factoresAgrupados(gs) {
  if (!gs.length) return '1';
  return gs.map(g => {
    if (Math.abs(g.z.im) < 1e-12) return Math.abs(g.z.re) < 1e-12 ? 's' + sup(g.mult) : factorHTML(g.z) + sup(g.mult);
    if (g.z.im < 0) return '';
    return '(' + polyHTML([1, -2 * g.z.re, g.z.re * g.z.re + g.z.im * g.z.im]) + ')' + sup(g.mult);
  }).join('');
}
const mod360 = a => { a = ((a % 360) + 360) % 360; return (360 - a < 1e-9) ? 0 : a; };
const angDe = z => Math.atan2(z.im, z.re) * 180 / Math.PI;
const fang = a => fnum(a, 2) + '°';

/* ---------- análisis completo (los pasos de la teoría) ---------- */
function analizar(e) {
  const { N, D } = e;
  const n = D.length - 1, m = N.length - 1;
  const polos = agrupar(e.polosL), ceros = agrupar(e.cerosL);
  const R = { ...e, n, m, polos, ceros };
  const sing = polos.concat(ceros);

  // 1) eje real
  const reales = sing.filter(g => Math.abs(g.z.im) < 1e-9).sort((a, b) => b.z.re - a.z.re);
  const filas = [];
  if (reales.length) {
    let acum = 0;
    filas.push({ a: reales[0].z.re, b: Infinity, cnt: 0, ok: false });
    reales.forEach((g, i) => {
      acum += g.mult;
      const sig = reales[i + 1];
      filas.push({ a: sig ? sig.z.re : -Infinity, b: g.z.re, cnt: acum, ok: acum % 2 === 1 });
    });
  }
  R.eje = filas;

  // 2) asíntotas
  const d = n - m, dd = Math.abs(d);
  R.asint = { d };
  if (d !== 0) {
    const sp = expandir(polos).reduce((s, z) => s + z.re, 0), sz = expandir(ceros).reduce((s, z) => s + z.re, 0);
    R.asint.sumP = sp; R.asint.sumZ = sz;
    R.asint.sigma = (sp - sz) / d;
    R.asint.angs = Array.from({ length: dd }, (_, k) => ({ k, crudo: 180 * (2 * k + 1) / dd, ang: mod360(180 * (2 * k + 1) / dd) }));
  }

  // 3) puntos de ruptura: dK/ds = 0  con  K = −D/N
  const Dp = pDer(D), Np = pDer(N);
  const t1 = pMul(Dp, N), t2 = pMul(D, Np);
  const P = pTrim(pAdd(t1, pScale(t2, -1)), 1e-11);
  const rup = { Dp, Np, t1, t2, P, filas: [] };
  if (P.length > 1) {
    agrupar(limpiar(raicesPoli(P))).forEach(g => {
      const s = g.z, Nv = pEval(N, s), Dv = pEval(D, s);
      let K = null, ok = false, nota = '';
      const real = Math.abs(s.im) < 1e-9;
      if (cAbs(Nv) < 1e-9) {
        // cero múltiple: K → ∞
        const r = real ? R.eje.some(f => f.ok && s.re <= f.b + 1e-9 && s.re >= f.a - 1e-9) : false;
        ok = r; nota = 'es un cero múltiple (K → ∞)';
      } else {
        K = cDiv(C(-Dv.re, -Dv.im), Nv);
        const kreal = Math.abs(K.im) <= 1e-6 * Math.max(1, Math.abs(K.re));
        if (kreal && K.re > 1e-9) ok = true;
        else if (kreal && Math.abs(K.re) <= 1e-9) { ok = true; nota = 'es un polo múltiple (K = 0)'; }
        else nota = kreal ? 'K < 0' : 'K no es real';
      }
      let tipo = '';
      if (ok && real && K && K.re > 1e-9) {
        const h = 1e-3 * (1 + Math.abs(s.re));
        const kf = x => { const c = cDiv(C(-pEval(D, C(x, 0)).re, 0), pEval(N, C(x, 0))); return c.re; };
        const k0 = K.re, k1 = kf(s.re - h), k2 = kf(s.re + h);
        tipo = (k0 > k1 && k0 > k2) ? 'salida del eje real' : (k0 < k1 && k0 < k2) ? 'ingreso al eje real' : '';
      }
      rup.filas.push({ z: s, mult: g.mult, K, ok, nota, tipo });
    });
  }
  R.rup = rup;

  // 4) cruce con el eje imaginario: s = jω
  const parte = (p, que) => {
    const g = p.length - 1, r = new Array(g + 1).fill(0);
    p.forEach((c, i) => {
      const k = g - i;
      if (que === 're' && k % 2 === 0) r[g - k] += c * (k % 4 === 0 ? 1 : -1);
      if (que === 'im' && k % 2 === 1) r[g - k] += c * (k % 4 === 1 ? 1 : -1);
    });
    return pTrim(r);
  };
  const Dr = parte(D, 're'), Di = parte(D, 'im'), Nr = parte(N, 're'), Ni = parte(N, 'im');
  const Q = pTrim(pAdd(pMul(Di, Nr), pScale(pMul(Dr, Ni), -1)), 1e-11);
  const cruce = { Dr, Di, Nr, Ni, Q, filas: [], identico: false };
  if (Q.length === 1 && Math.abs(Q[0]) < 1e-9) cruce.identico = true;
  else if (Q.length > 1 || Math.abs(Q[0]) > 0) {
    const ws = [];
    if (Q.length === 1) { /* constante no nula: sin raíces */ }
    else limpiar(raicesPoli(Q)).forEach(z => {
      if (Math.abs(z.im) > 1e-6 * Math.max(1, Math.abs(z.re))) return;
      const w = Math.abs(z.re);
      if (!ws.some(x => Math.abs(x - w) < 1e-6 * (1 + w))) ws.push(w);
    });
    ws.sort((a, b) => a - b).forEach(w => {
      const j = C(0, w), Dv = pEval(D, j), Nv = pEval(N, j);
      if (cAbs(Nv) < 1e-9) return;
      const K = Math.abs(Nv.re) >= Math.abs(Nv.im) ? -Dv.re / Nv.re : -Dv.im / Nv.im;
      const res = cAbs(C(Dv.re + K * Nv.re, Dv.im + K * Nv.im));
      if (res > 1e-6 * (1 + cAbs(Dv))) return;
      const valido = K > 1e-9;
      cruce.filas.push({ w, K, valido, nota: valido ? '' : (Math.abs(K) <= 1e-9 ? 'K = 0: es un polo sobre el eje imaginario' : 'K < 0: no pertenece al LGR') });
    });
  }
  R.cruce = cruce;

  // 5) ángulos de salida y de llegada
  const angulos = [];
  const complejos = g => Math.abs(g.z.im) > 1e-9;
  polos.filter(complejos).forEach(g => {
    const terminos = [];
    polos.forEach(o => { if (o !== g) terminos.push({ de: o, tipo: 'polo', v: cSub(g.z, o.z), ang: mod360(angDe(cSub(g.z, o.z))) }); });
    ceros.forEach(o => terminos.push({ de: o, tipo: 'cero', v: cSub(g.z, o.z), ang: mod360(angDe(cSub(g.z, o.z))) }));
    const sP = terminos.filter(t => t.tipo === 'polo').reduce((s, t) => s + t.ang * t.de.mult, 0);
    const sC = terminos.filter(t => t.tipo === 'cero').reduce((s, t) => s + t.ang * t.de.mult, 0);
    const vals = Array.from({ length: g.mult }, (_, k) => mod360((180 * (2 * k + 1) - sP + sC) / g.mult));
    angulos.push({ tipo: 'salida', g, terminos, sP, sC, vals });
  });
  ceros.filter(complejos).forEach(g => {
    const terminos = [];
    polos.forEach(o => terminos.push({ de: o, tipo: 'polo', v: cSub(g.z, o.z), ang: mod360(angDe(cSub(g.z, o.z))) }));
    ceros.forEach(o => { if (o !== g) terminos.push({ de: o, tipo: 'cero', v: cSub(g.z, o.z), ang: mod360(angDe(cSub(g.z, o.z))) }); });
    const sP = terminos.filter(t => t.tipo === 'polo').reduce((s, t) => s + t.ang * t.de.mult, 0);
    const sC = terminos.filter(t => t.tipo === 'cero').reduce((s, t) => s + t.ang * t.de.mult, 0);
    const vals = Array.from({ length: g.mult }, (_, k) => mod360((180 * (2 * k + 1) + sP - sC) / g.mult));
    angulos.push({ tipo: 'llegada', g, terminos, sP, sC, vals });
  });
  R.angulos = angulos;

  // 6) conclusión sobre los polos de lazo cerrado
  const crit = cruce.filas.filter(f => f.valido).map(f => f.K).sort((a, b) => a - b).filter((k, i, a) => !i || k - a[i - 1] > 1e-9 * (1 + k));
  const lim = [0, ...crit, Infinity];
  R.tramos = [];
  for (let i = 0; i < lim.length - 1; i++) {
    const a = lim[i], b = lim[i + 1];
    const Kt = isFinite(b) ? (a + b) / 2 : (a > 0 ? a * 2 : 1);
    const rs = limpiar(raicesPoli(pAdd(D, pScale(N, Kt))));
    R.tramos.push({ a, b, spd: rs.filter(z => z.re > 1e-7).length, eje: rs.filter(z => Math.abs(z.re) <= 1e-7).length });
  }
  R.polosLA_spd = expandir(polos).filter(z => z.re > 1e-9).length;
  R.crit = crit;

  // puntos de interés y escala
  const clave = expandir(polos).concat(expandir(ceros));
  rup.filas.forEach(f => f.ok && clave.push(f.z));
  cruce.filas.forEach(f => { if (f.valido) { clave.push(C(0, f.w)); clave.push(C(0, -f.w)); } });
  if (R.asint.sigma !== undefined) clave.push(C(R.asint.sigma, 0));
  R.clave = clave;
  R.escala = Math.max(1e-3, ...clave.map(cAbs));
  return R;
}

/* ---------- trazado numérico de las ramas ---------- */
function trazarLGR(R) {
  const { N, D, n, m } = R;
  const esc = R.escala, Rmax = 15 * esc, tope = 0.02 * esc;
  const sing = expandir(R.polos).concat(expandir(R.ceros));
  const zerosL = expandir(R.ceros);
  const dist = z => Math.min(...sing.map(s => cAbs(cSub(z, s))));
  const P = K => pAdd(D, pScale(N, K));
  let K = 0, prev;
  if (n >= m) prev = expandir(R.polos).map(z => C(z.re, z.im));
  else { K = 1e-9; prev = limpiar(raicesPoli(P(K))); }
  const ramas = prev.map(z => ({ x: [z.re], y: [z.im], K: [K] }));
  const hecha = prev.map(() => false);
  let dK = n >= m ? 1e-9 : 1e-9;
  const t0 = performance.now();
  for (let it = 0; it < 30000; it++) {
    if (performance.now() - t0 > 1500) break;
    // separar guesses repetidos para que Aberth no se trabe
    const ini = prev.map((z, i) => {
      for (let j = 0; j < i; j++) if (cAbs(cSub(z, prev[j])) < 1e-7 * (1 + cAbs(z))) {
        const a = 2 * Math.PI * i / prev.length + 0.3;
        return C(z.re + 1e-6 * esc * Math.cos(a), z.im + 1e-6 * esc * Math.sin(a));
      }
      return z;
    });
    let nuevo, asig, ratio, ok = false;
    for (let intento = 0; intento < 60 && !ok; intento++) {
      nuevo = raicesPoli(P(K + dK), ini);
      if (nuevo.length !== prev.length) { dK /= 2; continue; }
      // asignación voraz por distancia mínima
      const pares = [];
      for (let i = 0; i < prev.length; i++) for (let j = 0; j < nuevo.length; j++) pares.push([cAbs(cSub(prev[i], nuevo[j])), i, j]);
      pares.sort((a, b) => a[0] - b[0]);
      const ui = new Set(), uj = new Set();
      asig = new Array(prev.length);
      ratio = 0;
      for (const [dst, i, j] of pares) {
        if (ui.has(i) || uj.has(j)) continue;
        ui.add(i); uj.add(j); asig[i] = j;
        if (hecha[i]) continue;
        const perm = Math.min(tope, Math.max(0.05 * dist(prev[i]), 1e-6 * esc));
        ratio = Math.max(ratio, dst / perm);
      }
      if (ratio > 1 && dK > 1e-14 * Math.max(1, K)) dK /= 2; else ok = true;
    }
    K += dK;
    const nueva = [];
    for (let i = 0; i < prev.length; i++) {
      const z = nuevo[asig[i]];
      nueva.push(z);
      if (cAbs(z) < 2 * Rmax) { ramas[i].x.push(z.re); ramas[i].y.push(z.im); ramas[i].K.push(K); }
      if (cAbs(z) > Rmax || zerosL.some(c => cAbs(cSub(z, c)) < 1e-3 * esc)) hecha[i] = true;
    }
    prev = nueva;
    if (hecha.every(Boolean) || K > 1e15) break;
    if (ratio < 0.3) dK *= 2;
  }
  return ramas;
}

function construirModelo(S) {
  const notas = [];
  if (S.modo === 'ec') {
    let N0, D0;
    try { N0 = parsearPoli(S.N); } catch (err) { throw new ErrorEntrada('Numerador: ' + err.message, { campo: 'N' }); }
    try { D0 = parsearPoli(S.D); } catch (err) { throw new ErrorEntrada('Denominador: ' + err.message, { campo: 'D' }); }
    if (D0.length < 2) throw new ErrorEntrada('El denominador tiene que ser de grado 1 o más.', { campo: 'D' });
    if (N0.length === 1 && Math.abs(N0[0]) < 1e-14) throw new ErrorEntrada('El numerador no puede ser 0.', { campo: 'N' });
    const c = N0[0], d = D0[0];
    const N = pScale(N0, 1 / c), D = pScale(D0, 1 / d);
    const ganancia = c / d;
    if (Math.abs(ganancia - 1) > 1e-12)
      notas.push('Se llevaron N(s) y D(s) a forma mónica: el parámetro del LGR pasa a ser K′ = K · ' + fnum(ganancia) + (ganancia < 0 ? ' (como es negativo, el LGR dibujado corresponde a K′ > 0, es decir, K < 0 en la ecuación original)' : '') + '.');
    const cerosL = limpiar(raicesPoli(N)), polosL = limpiar(raicesPoli(D));
    return { modo: 'ec', N, D, N0, D0, cerosL, polosL, notas };
  }
  let cerosL, polosL;
  try { cerosL = parsearLista(S.Z); } catch (err) { throw new ErrorEntrada('Ceros: ' + err.message, { campo: 'Z' }); }
  try { polosL = parsearLista(S.P); } catch (err) { throw new ErrorEntrada('Polos: ' + err.message, { campo: 'P' }); }
  if (!polosL.length) throw new ErrorEntrada('Hace falta al menos un polo.', { campo: 'P' });
  // los complejos tienen que venir con su conjugado, si no los coeficientes no son reales
  const faltan = { Z: [], P: [] };
  [['Z', cerosL], ['P', polosL]].forEach(([k, lista]) => {
    const libres = lista.slice();
    lista.forEach(z => {
      if (Math.abs(z.im) < 1e-12) return;
      const i = libres.findIndex(w => Math.abs(w.re - z.re) < 1e-9 && Math.abs(w.im + z.im) < 1e-9);
      if (i >= 0) { libres.splice(i, 1); return; }
      const yaMarcado = libres.findIndex(w => w === z);
      if (yaMarcado >= 0) libres.splice(yaMarcado, 1);
      faltan[k].push(C(z.re, -z.im));
    });
  });
  if (faltan.Z.length || faltan.P.length) {
    const txt = [['ceros', faltan.Z], ['polos', faltan.P]].filter(x => x[1].length).map(x => x[0] + ': ' + x[1].map(fcomp).join('; ')).join(' · ');
    throw new ErrorEntrada('Falta el conjugado de algún número complejo (' + txt + '). Con coeficientes reales los complejos aparecen de a pares.', { faltan });
  }
  const N = pDesdeRaices(cerosL), D = pDesdeRaices(polosL);
  return { modo: 'zp', N, D, cerosL: limpiar(cerosL), polosL: limpiar(polosL), notas };
}

const $ = id => document.getElementById(id);
const svg = $('canvas'), stage = $('stage');
let S = { modo: 'ec', N: 's+4,5', D: 's(s^2+6s+45)', Z: '', P: '', ver: { asint: true, vals: true, flechas: true, grid: true } };
let Rg = null;           // resultado del análisis
let ramas = [];          // ramas del LGR
let V = { cx: -2, cy: 0, k: 40 };
let aviso = null;
const COLORES = ['#0d5bd6', '#e07a10', '#1a9a4b', '#8e44ad', '#c0392b', '#12a3a3', '#8d6e3f', '#d6459c', '#5c6bc0', '#7f8c8d'];

function guardar() { try { localStorage.setItem('uni-tools-lgr', JSON.stringify(S)); } catch (e) {} }
function cargar() {
  try {
    const g = JSON.parse(localStorage.getItem('uni-tools-lgr') || 'null');
    if (g && typeof g === 'object') S = { ...S, ...g, ver: { ...S.ver, ...(g.ver || {}) } };
  } catch (e) {}
}

function calcular() {
  const msj = $('msj');
  ['N', 'D', 'Z', 'P'].forEach(c => $('i-' + c).classList.remove('mal'));
  msj.className = ''; msj.innerHTML = '';
  guardar();
  try {
    const modelo = construirModelo(S);
    Rg = analizar(modelo);
    ramas = trazarLGR(Rg);
    aviso = null;
    const info = Rg.notas.length ? '<span class="nota-info">' + Rg.notas.map(esc).join(' ') + '</span>' : '';
    if (info) { msj.className = 'on'; msj.style.color = 'var(--ink-2)'; msj.innerHTML = info; }
    cancelaciones(modelo);
  } catch (err) {
    Rg = null; ramas = [];
    if (err instanceof ErrorEntrada || err.extra !== undefined) {
      if (err.extra && err.extra.campo) $('i-' + err.extra.campo).classList.add('mal');
      msj.className = 'on'; msj.style.color = '';
      msj.innerHTML = esc(err.message);
      if (err.extra && err.extra.faltan) {
        const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Agregar conjugados';
        b.onclick = () => {
          const f = err.extra.faltan;
          if (f.Z.length) S.Z = (S.Z.trim() ? S.Z.trim() + '; ' : '') + f.Z.map(fcomp).join('; ');
          if (f.P.length) S.P = (S.P.trim() ? S.P.trim() + '; ' : '') + f.P.map(fcomp).join('; ');
          pasarAInputs(); calcular();
        };
        msj.appendChild(b);
      }
    } else { console.error(err); msj.className = 'on'; msj.style.color = ''; msj.textContent = 'No se pudo calcular: ' + err.message; }
  }
  dibujarResumen(); dibujarDetalles(); ajustarVista(); dibujar();
}
function cancelaciones(modelo) {
  const msj = $('msj'), c = [];
  Rg.polos.forEach(p => Rg.ceros.forEach(z => { if (cAbs(cSub(p.z, z.z)) < 1e-6 * (1 + cAbs(p.z))) c.push(fcomp(p.z)); }));
  if (c.length) {
    msj.className = 'on'; msj.style.color = 'var(--warn)';
    msj.innerHTML = (msj.innerHTML ? msj.innerHTML + '<br>' : '') + 'Hay un polo y un cero en el mismo punto (' + c.map(esc).join('; ') + '): se cancelan en la función de transferencia.';
  }
}

function dibujarResumen() {
  const el = $('resumen');
  if (!Rg) { el.innerHTML = ''; return; }
  const lista = gs => gs.length ? gs.map(g => '<b>' + fcomp(g.z) + '</b>' + (g.mult > 1 ? ' (×' + g.mult + ')' : '')).join(' ; ') : '<i>no hay</i>';

    el.innerHTML = 'Ceros (<b>m = ' + Rg.m + '</b>): ' + lista(Rg.ceros) + '<br>Polos (<b>n = ' + Rg.n + '</b>): ' + lista(Rg.polos);
  else
    el.innerHTML = 'Ecuación característica: <b>1 + K · ' + fr(polyHTML(Rg.N), polyHTML(Rg.D)) + ' = 0</b>';

/* ---------- vista ---------- */
function ajustarVista() {
  const W = stage.clientWidth || 800, H = stage.clientHeight || 500;
  const pts = Rg ? Rg.clave : [C(-1, 0), C(1, 0)];
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  pts.forEach(z => { x0 = Math.min(x0, z.re); x1 = Math.max(x1, z.re); y0 = Math.min(y0, z.im); y1 = Math.max(y1, z.im); });
  let bw = x1 - x0, bh = y1 - y0;
  const ref = Math.max(bw, bh);
  if (!(ref > 1e-9)) { bw = bh = 4; } else { bw = Math.max(bw, ref * 0.25); bh = Math.max(bh, ref * 0.25); }
  V.cx = (x0 + x1) / 2; V.cy = (y0 + y1) / 2;
  V.k = Math.min(W / (bw * 1.5), H / (bh * 1.5));
  if (Rg && Rg.asint.d > 0 && Rg.asint.sigma !== undefined) { /* las asíntotas salen de la vista: ya se ve su dirección */ }
}
const nice = r => {
  const p = Math.pow(10, Math.floor(Math.log10(r))), f = r / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
};

function dibujar() {
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const X = x => W / 2 + (x - V.cx) * V.k, Y = y => H / 2 - (y - V.cy) * V.k;
  const f1 = v => Math.round(v * 10) / 10;
  let o = '';
  const xmin = V.cx - W / 2 / V.k, xmax = V.cx + W / 2 / V.k, ymin = V.cy - H / 2 / V.k, ymax = V.cy + H / 2 / V.k;
  const paso = nice(70 / V.k);
  const dec = Math.max(0, -Math.floor(Math.log10(paso)));
  // cuadrícula y ejes
  if (S.ver.grid) {
    for (let x = Math.ceil(xmin / paso) * paso; x <= xmax; x += paso) o += '<line x1="' + f1(X(x)) + '" y1="0" x2="' + f1(X(x)) + '" y2="' + H + '" stroke="#eef2f6"/>';
    for (let y = Math.ceil(ymin / paso) * paso; y <= ymax; y += paso) o += '<line x1="0" y1="' + f1(Y(y)) + '" x2="' + W + '" y2="' + f1(Y(y)) + '" stroke="#eef2f6"/>';
  }
  const ex = Math.min(Math.max(Y(0), 14), H - 6), ey = Math.min(Math.max(X(0), 8), W - 30);
  o += '<line x1="0" y1="' + f1(Y(0)) + '" x2="' + W + '" y2="' + f1(Y(0)) + '" stroke="#8a97a5" stroke-width="1.2"/>';
  o += '<line x1="' + f1(X(0)) + '" y1="0" x2="' + f1(X(0)) + '" y2="' + H + '" stroke="#8a97a5" stroke-width="1.2"/>';
  const etq = 'font-family="Arial" font-size="10" fill="#7b8896"';
  for (let x = Math.ceil(xmin / paso) * paso; x <= xmax; x += paso) {
    if (Math.abs(x) < paso / 2) continue;
    o += '<text x="' + f1(X(x)) + '" y="' + f1(ex + (ex > Y(0) - 1 ? 12 : -5)) + '" text-anchor="middle" ' + etq + '>' + fnum(x, dec) + '</text>';
  }
  for (let y = Math.ceil(ymin / paso) * paso; y <= ymax; y += paso) {
    if (Math.abs(y) < paso / 2) continue;
    o += '<text x="' + f1(ey + 4) + '" y="' + f1(Y(y) + 3) + '" ' + etq + '>' + fnum(y, dec) + 'j</text>';
  }
  o += '<text x="' + (W - 8) + '" y="' + f1(Math.min(Math.max(Y(0) - 6, 12), H - 22)) + '" text-anchor="end" font-family="Arial" font-size="11" font-style="italic" fill="#5b6875">Re</text>';
  o += '<text x="' + f1(Math.min(X(0) + 6, W - 24)) + '" y="12" font-family="Arial" font-size="11" font-style="italic" fill="#5b6875">Im</text>';

  if (Rg) {
    const halo = 'paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round"';
    const txt = (x, y, s, col = '#12181f', anc = 'start', ex = '') => '<text x="' + f1(x) + '" y="' + f1(y) + '" font-family="Arial" font-size="11.5" fill="' + col + '" text-anchor="' + anc + '" ' + halo + ' ' + ex + '>' + s + '</text>';
    // asíntotas
    if (S.ver.asint && Rg.asint.sigma !== undefined) {
      const sg = Rg.asint.sigma, L = (W + H) / V.k;
      Rg.asint.angs.forEach(a => {
        const r = a.ang * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
        o += '<line x1="' + f1(X(sg)) + '" y1="' + f1(Y(0)) + '" x2="' + f1(X(sg + L * c)) + '" y2="' + f1(Y(L * s)) + '" stroke="#7b8896" stroke-width="1.2" stroke-dasharray="6 4"/>';
        if (S.ver.vals) {
          const dpx = 70 / V.k;
          o += txt(X(sg + dpx * c) + (c >= 0 ? 4 : -4), Y(dpx * s) + (s >= 0 ? -6 : 14), fnum(a.ang, 2) + '°', '#5b6875', c >= 0 ? 'start' : 'end');
        }
      });
      o += '<path d="M' + f1(X(sg)) + ' ' + f1(Y(0) - 6) + ' l6 6 l-6 6 l-6 -6z" fill="#fff" stroke="#5b6875" stroke-width="1.4"/>';
      if (S.ver.vals) o += txt(X(sg), Y(0) + 22, 'σa = ' + fnum(sg), '#5b6875', 'middle');
    }
    // ramas
    ramas.forEach((r, bi) => {
      const col = COLORES[bi % COLORES.length];
      let d = '', lx = 1e9, ly = 1e9, acum = 0, sig = 130;
      let flechas = '';
      for (let i = 0; i < r.x.length; i++) {
        const px = X(r.x[i]), py = Y(r.y[i]);
        if (Math.abs(px) > 1e5 || Math.abs(py) > 1e5) continue;
        const dx = px - lx, dy = py - ly, seg = Math.hypot(dx, dy);
        if (seg < 0.7 && i < r.x.length - 1) continue;
        d += (d ? 'L' : 'M') + f1(px) + ' ' + f1(py);
        if (lx < 1e8) {
          acum += seg;
          if (S.ver.flechas && acum > sig && px > 0 && px < W && py > 0 && py < H && seg > 0.5) {
            const a = Math.atan2(dy, dx), ca = Math.cos(a), sa = Math.sin(a);
            flechas += '<path d="M' + f1(px) + ' ' + f1(py) + ' l' + f1(-9 * ca + 4.5 * sa) + ' ' + f1(-9 * sa - 4.5 * ca) + ' l' + f1(1 * ca - 9 * sa) + ' ' + f1(1 * sa + 9 * ca) + 'z" fill="' + col + '"/>';
            sig = acum + 260;
          }
        }
        lx = px; ly = py;
      }
      o += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' + flechas;
    });
    // puntos de ruptura y cruces
    if (S.ver.vals) {
      Rg.rup.filas.filter(f => f.ok).forEach(f => {
        const px = X(f.z.re), py = Y(f.z.im);
        o += '<rect x="' + f1(px - 4.5) + '" y="' + f1(py - 4.5) + '" width="9" height="9" fill="#fff" stroke="#c2410c" stroke-width="2"/>';
        o += txt(px, py + (f.z.im > 0 ? -10 : 20), 'σb = ' + fcomp(f.z, 3) + (f.K ? '  (K = ' + fnum(f.K.re, 3) + ')' : ''), '#c2410c', 'middle');
      });
      Rg.cruce.filas.filter(f => f.valido).forEach(f => (f.w < 1e-9 ? [1] : [1, -1]).forEach(sg => {
        const px = X(0), py = Y(sg * f.w);
        o += '<path d="M' + f1(px) + ' ' + f1(py - 6) + ' l6 6 l-6 6 l-6 -6z" fill="#fff" stroke="#8e44ad" stroke-width="2"/>';
        const nombre = f.w < 1e-9 ? 'ωc = 0' : (sg > 0 ? '+' : '−') + 'jωc = ' + (sg > 0 ? '' : '−') + 'j' + fnum(f.w, 3);
        o += txt(px + 10, f.w < 1e-9 ? py - 10 : py + 4, nombre + '  (Kc = ' + fnum(f.K, 3) + ')', '#8e44ad');
      }));
    }
    // polos y ceros (con ángulos)
    const angulos = [];
    Rg.angulos.forEach(a => a.vals.forEach(v => angulos.push({ a, v })));
    if (S.ver.vals) angulos.forEach(({ a, v }) => {
      const px = X(a.g.z.re), py = Y(a.g.z.im), r = v * Math.PI / 180;
      const cx = Math.cos(r), cy = -Math.sin(r), ex = px + 40 * cx, ey = py + 40 * cy, col = a.tipo === 'salida' ? '#c0392b' : '#0d5bd6';
      o += '<line x1="' + f1(px) + '" y1="' + f1(py) + '" x2="' + f1(ex) + '" y2="' + f1(ey) + '" stroke="' + col + '" stroke-width="1.4" stroke-dasharray="3 2"/>';
      o += txt(ex + (cx >= 0 ? 4 : -4), ey + (cy >= 0 ? 12 : -4), (a.tipo === 'salida' ? 'θ = ' : 'φ = ') + fnum(v, 2) + '°', col, cx >= 0 ? 'start' : 'end');
    });
    Rg.ceros.forEach(g => {
      const px = X(g.z.re), py = Y(g.z.im);
      o += '<circle cx="' + f1(px) + '" cy="' + f1(py) + '" r="6" fill="#fff" stroke="#12181f" stroke-width="2"/>';
      if (g.mult > 1) o += txt(px + 8, py - 8, '×' + g.mult, '#12181f');
    });
    Rg.polos.forEach(g => {
      const px = X(g.z.re), py = Y(g.z.im);
      o += '<path d="M' + f1(px - 5.5) + ' ' + f1(py - 5.5) + ' l11 11 M' + f1(px - 5.5) + ' ' + f1(py + 5.5) + ' l11 -11" stroke="#12181f" stroke-width="2.4" stroke-linecap="round"/>';
      if (g.mult > 1) o += txt(px + 8, py - 8, '×' + g.mult, '#12181f');
    });
  }
  svg.innerHTML = o;
  $('vacio').style.display = Rg ? 'none' : 'flex';
  $('leyenda').style.display = Rg ? '' : 'none';
  if (Rg) {
    $('leyenda').innerHTML =
      '<div><svg viewBox="0 0 16 12"><path d="M3 1 l10 10 M3 11 l10 -10" stroke="#12181f" stroke-width="2.2"/></svg>polos</div>' +
      '<div><svg viewBox="0 0 16 12"><circle cx="8" cy="6" r="4.5" fill="#fff" stroke="#12181f" stroke-width="2"/></svg>ceros</div>' +
      '<div><svg viewBox="0 0 16 12"><path d="M1 6h14" stroke="#0d5bd6" stroke-width="2.2"/></svg>LGR (K &gt; 0)</div>' +
      '<div><svg viewBox="0 0 16 12"><path d="M1 6h14" stroke="#7b8896" stroke-width="1.4" stroke-dasharray="4 3"/></svg>asíntotas</div>';
  }
}

/* ---------- interacción con el gráfico ---------- */
const punteros = new Map();
let arrastre = null;
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
  arrastre = { cx: V.cx, cy: V.cy, k: V.k, x: e.clientX, y: e.clientY, dist: distancia(), mx: media().x, my: media().y };
  svg.classList.add('arrastrando');
  $('tip').style.display = 'none';
});
const distancia = () => { const p = [...punteros.values()]; return p.length < 2 ? 0 : Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
const media = () => { const p = [...punteros.values()]; return p.length ? { x: p.reduce((s, q) => s + q.x, 0) / p.length, y: p.reduce((s, q) => s + q.y, 0) / p.length } : { x: 0, y: 0 }; };
svg.addEventListener('pointermove', e => {
  if (punteros.has(e.pointerId)) {
    punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!arrastre) return;
    if (punteros.size >= 2 && arrastre.dist > 0) {
      const f = distancia() / arrastre.dist, m = media();
      V.k = arrastre.k * f;
      V.cx = arrastre.cx - (m.x - arrastre.mx) / V.k;
      V.cy = arrastre.cy + (m.y - arrastre.my) / V.k;
    } else if (punteros.size === 1) {
      V.cx = arrastre.cx - (e.clientX - arrastre.x) / V.k;
      V.cy = arrastre.cy + (e.clientY - arrastre.y) / V.k;
    }
    dibujar();
    return;
  }
  mostrarTip(e);
});
function soltar(e) {
  punteros.delete(e.pointerId);
  arrastre = punteros.size ? { cx: V.cx, cy: V.cy, k: V.k, x: media().x, y: media().y, dist: distancia(), mx: media().x, my: media().y } : null;
  if (!punteros.size) svg.classList.remove('arrastrando');
}
svg.addEventListener('pointerup', soltar);
svg.addEventListener('pointercancel', soltar);
svg.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });
function zoomEn(f, px, py) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const mx = V.cx + (px - W / 2) / V.k, my = V.cy - (py - H / 2) / V.k;
  V.k *= f;
  V.cx = mx - (px - W / 2) / V.k; V.cy = my + (py - H / 2) / V.k;
  dibujar();
}
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomEn(Math.pow(1.0017, -e.deltaY), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
svg.addEventListener('dblclick', () => { ajustarVista(); dibujar(); });
$('z-mas').onclick = () => zoomEn(1.3, stage.clientWidth / 2, stage.clientHeight / 2);
$('z-menos').onclick = () => zoomEn(1 / 1.3, stage.clientWidth / 2, stage.clientHeight / 2);

/* Al pasar el mouse por una rama: el punto s y el K que le corresponde */
let tipPend = false;
function mostrarTip(e) {
  if (tipPend || !Rg) return;
  tipPend = true;
  requestAnimationFrame(() => {
    tipPend = false;
    const r = svg.getBoundingClientRect(), W = r.width, H = r.height;
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = 14, hit = null;
    ramas.forEach(b => {
      for (let i = 0; i < b.x.length; i++) {
        const px = W / 2 + (b.x[i] - V.cx) * V.k, py = H / 2 - (b.y[i] - V.cy) * V.k;
        const d = Math.hypot(px - mx, py - my);
        if (d < best) { best = d; hit = { x: b.x[i], y: b.y[i], K: b.K[i], px, py }; }
      }
    });
    const tip = $('tip');
    if (!hit) { tip.style.display = 'none'; return; }
    tip.textContent = 's = ' + fcomp(C(hit.x, hit.y), 3) + '   K = ' + fnum(hit.K, 4);
    tip.style.display = 'block';
    tip.style.left = Math.min(hit.px + 12, W - tip.offsetWidth - 6) + 'px';
    tip.style.top = Math.max(hit.py - 30, 4) + 'px';
  });
}
new ResizeObserver(() => dibujar()).observe(stage);

/* =====================================================================
   DETALLES PASO A PASO
   ===================================================================== */
function dibujarDetalles() {
  const el = $('det-cuerpo');
  if (!Rg) { el.innerHTML = '<div class="vacio-det">Cuando ingreses una función válida, acá aparecen todos los cálculos paso a paso.</div>'; return; }
  const R = Rg;
  const abiertos = new Set([...el.querySelectorAll('details.paso[open]')].map(d => d.dataset.id));
  const primera = !el.querySelector('details.paso');
  const paso = (id, n, titulo, cuerpo) =>
    '<details class="paso" data-id="' + id + '"' + (primera || abiertos.has(id) ? ' open' : '') + '><summary><span class="num">' + n + '</span>' + titulo + '</summary><div class="cuerpo">' + cuerpo + '</div></details>';
  const ec = (h, sm) => '<div class="ec' + (sm ? ' sm' : '') + '">' + h + '</div>';
  const listaSing = (gs, v) => gs.length ? gs.map(g => fcomp(g.z) + (g.mult > 1 ? ' <small>(×' + g.mult + ')</small>' : '')).join(' ; ') : '—';
  let h = '';

  /* 1. Ecuación característica */
  let b = '';
  if (R.modo === 'zp') {
    b += '<p>La ecuación característica es <b>1 + K · G(s)H(s) = 0</b>, con los factores de los ceros arriba y los de los polos abajo:</p>';
    b += ec('1 + K · ' + fr(factoresSimples(R.ceros), factoresSimples(R.polos)) + ' = 0');
    b += '<p>Agrupando cada par de complejos conjugados en un polinomio de segundo grado:</p>';
    b += ec('1 + K · ' + fr(factoresAgrupados(R.ceros), factoresAgrupados(R.polos)) + ' = 0');
    b += '<p>Desarrollando los productos:</p>';
    b += ec('1 + K · ' + fr(polyHTML(R.N), polyHTML(R.D)) + ' = 0');
  } else {
    b += '<p>Dato: <b>1 + K · N(s)/D(s) = 0</b>.</p>';
    b += ec('1 + K · ' + fr(polyHTML(R.N0), polyHTML(R.D0)) + ' = 0');
    if (R.notas.length) b += '<p>' + R.notas.map(esc).join(' ') + '</p>' + ec('1 + K′ · ' + fr(polyHTML(R.N), polyHTML(R.D)) + ' = 0');
    b += '<p>Los <b>ceros</b> son las raíces de N(s) = 0 y los <b>polos</b>, las de D(s) = 0:</p>';
    b += ec('N(s) = ' + factoresSimples(R.ceros) + (R.m ? '' : ' (constante)'), true);
    b += ec('D(s) = ' + factoresSimples(R.polos), true);
  }
  b += '<p>Forma polinómica: <b>D(s) + K·N(s) = 0</b></p>';
  b += ec(polyHTML(R.D) + ' + K·(' + polyHTML(R.N) + ') = 0', true);
  h += paso('car', 1, 'Ecuación característica', b);

  /* 2. Polos, ceros y eje real */
  b = '<table class="t"><tr><th>Singularidad</th><th>Valores</th><th>Cantidad</th></tr>' +
    '<tr><td>Ceros</td><td>' + listaSing(R.ceros) + '</td><td>m = ' + R.m + '</td></tr>' +
    '<tr><td>Polos</td><td>' + listaSing(R.polos) + '</td><td>n = ' + R.n + '</td></tr></table>';
  b += '<p>El LGR tiene <b>' + Math.max(R.n, R.m) + ' ramas</b>: nacen en los polos (K = 0) y terminan en los ceros (K → ∞)' +
    (R.n > R.m ? '; las <b>' + (R.n - R.m) + '</b> restantes se van al infinito siguiendo las asíntotas.' : R.n < R.m ? '; ' + (R.m - R.n) + ' ramas llegan desde el infinito.' : '.') + '</p>';
  b += '<p><b>LGR sobre el eje real:</b> un punto del eje real pertenece al lugar si deja a su <b>derecha</b> una cantidad <b>impar</b> de polos y ceros reales (con su multiplicidad). Los complejos no cuentan.</p>';
  if (!R.eje.length) b += '<div class="res no-res">No hay polos ni ceros reales: ningún tramo del eje real pertenece al LGR.</div>';
  else {
    const lim = x => x === Infinity ? '+∞' : x === -Infinity ? '−∞' : fnum(x);
    b += '<table class="t"><tr><th>Tramo</th><th>Sing. a la derecha</th><th>¿LGR?</th></tr>' +
      R.eje.map(f => '<tr><td>(' + lim(f.a) + ' ; ' + lim(f.b) + ')</td><td>' + f.cnt + '</td><td class="' + (f.ok ? 'si' : 'no') + '">' + (f.ok ? 'Sí (impar)' : 'No') + '</td></tr>').join('') + '</table>';
    const ok = R.eje.filter(f => f.ok);
    b += ok.length ? '<div class="res">Pertenece al LGR: ' + ok.map(f => '[' + (f.a === -Infinity ? '−∞' : fnum(f.a)) + ' ; ' + fnum(f.b) + ']').join(' ∪ ') + '</div>' : '<div class="res no-res">Ningún tramo del eje real pertenece al LGR.</div>';
  }
  h += paso('eje', 2, 'Polos, ceros y LGR sobre el eje real', b);

  /* 3. Ángulos de las asíntotas */
  const A = R.asint, d = A.d;
  b = '<p>Cantidad de asíntotas: <b>|n − m|</b> = |' + R.n + ' − ' + R.m + '| = ' + Math.abs(d) + '.</p>';
  if (d === 0) {
    b += '<div class="res no-res">No hay asíntotas: n − m = ' + R.n + ' − ' + R.m + ' = 0, así que la expresión 180°(2k+1)/(n − m) divide por cero. Las ' + R.n + ' ramas terminan en los ' + R.m + ' ceros y ninguna se va al infinito.</div>';
  } else {
    b += ec('θ<sub>k</sub> = ' + fr('180°·(2k + 1)', d > 0 ? 'n − m' : 'm − n') + ',&nbsp; k = 0, 1, …, ' + (Math.abs(d) - 1), true);
    b += '<table class="t"><tr><th>k</th><th>Cálculo</th><th>θ<sub>k</sub></th></tr>' + A.angs.map(a =>
      '<tr><td>' + a.k + '</td><td>180°·(2·' + a.k + ' + 1) / ' + Math.abs(d) + ' = ' + fnum(a.crudo, 2) + '°</td><td><b>' + fang(a.ang) + '</b></td></tr>').join('') + '</table>';
    if (A.angs.some(a => Math.abs(a.crudo - a.ang) > 1e-9)) b += '<p>Los ángulos mayores a 360° se reducen restando vueltas completas.</p>';
    if (Math.abs(d) === 1) b += '<p>Como hay una sola asíntota, k = 1, 2… repiten el mismo ángulo.</p>';
    if (d < 0) b += '<p>Como n &lt; m, las ramas llegan desde el infinito (hay m − n polos en el infinito).</p>';
  }
  h += paso('asi', 3, 'Ángulos de las asíntotas', b);

  /* 4. Centroide */
  if (d === 0) b = '<div class="res no-res">No existe punto de origen de las asíntotas porque no hay asíntotas (n − m = 0 haría que σ<sub>a</sub> = (Σp − Σz)/0 no esté definido).</div>';
  else {
    const sp = expandir(R.polos).map(z => '(' + fcomp(z) + ')').join(' + '), sz = expandir(R.ceros).map(z => '(' + fcomp(z) + ')').join(' + ');
    b = ec('σ<sub>a</sub> = ' + fr('Σ polos − Σ ceros', 'n − m'), true);
    b += ec('σ<sub>a</sub> = ' + fr('[' + sp + '] − [' + (sz || '0') + ']', R.n + ' − ' + R.m), true);
    b += ec('σ<sub>a</sub> = ' + fr(fnum(A.sumP) + ' − (' + fnum(A.sumZ) + ')', fnum(d)) + ' = <b>' + fnum(A.sigma) + '</b>', true);
    b += '<p>La parte imaginaria de las sumas es 0 porque los complejos vienen de a pares conjugados.</p><div class="res">Las asíntotas nacen en σ<sub>a</sub> = ' + fnum(A.sigma) + ' (sobre el eje real).</div>';
  }
  h += paso('cen', 4, 'Punto donde nacen las asíntotas', b);

  /* 5. Puntos de ruptura */
  const Rp = R.rup;
  b = '<p>Se despeja K de la ecuación característica y se deriva respecto de s:</p>';
  b += ec('K = −' + fr('D(s)', 'N(s)') + ' = ' + fr('−(' + polyHTML(R.D) + ')', polyHTML(R.N)), true);
  b += ec(fr('dK', 'ds') + ' = ' + fr("D′(s)·N(s) − D(s)·N′(s)", 'N(s)²') + ' = 0', true);
  b += '<p>Como un cociente es 0 cuando su numerador es 0, alcanza con resolver <b>D′N − D·N′ = 0</b>:</p>';
  b += ec("D′(s) = " + polyHTML(Rp.Dp), true) + ec("N′(s) = " + (R.m ? polyHTML(Rp.Np) : '0 (N es constante)'), true);
  b += ec("D′·N = " + polyHTML(Rp.t1), true) + ec("D·N′ = " + polyHTML(Rp.t2), true);
  b += ec("D′·N − D·N′ = " + polyHTML(Rp.P) + ' = 0', true);
  if (!Rp.filas.length) b += '<div class="res no-res">El polinomio no tiene raíces: <b>no hay puntos de ruptura</b>.</div>';
  else {
    b += '<p>Un candidato es punto de ruptura si pertenece al LGR, es decir, si el K que le corresponde (K = −D/N) es <b>real y positivo</b>.</p>';
    b += '<table class="t"><tr><th>Raíz s</th><th>K = −D/N</th><th>¿Punto de ruptura?</th></tr>' + Rp.filas.map(f =>
      '<tr><td>' + fcomp(f.z, 4) + (f.mult > 1 ? ' <small>(×' + f.mult + ')</small>' : '') + '</td><td>' + (f.K ? fcomp(f.K, 4) : '∞') + '</td><td class="' + (f.ok ? 'si' : 'no') + '">' +
      (f.ok ? 'Sí' + (f.tipo ? ' · ' + f.tipo : '') + (f.nota ? ' · ' + f.nota : '') : 'No · ' + f.nota) + '</td></tr>').join('') + '</table>';
    const ok = Rp.filas.filter(f => f.ok);
    b += ok.length ? '<div class="res">Puntos de ruptura: ' + ok.map(f => 's = ' + fcomp(f.z)).join(' ; ') + '</div>' : '<div class="res no-res">Ninguna raíz pertenece al LGR: <b>no hay puntos de ruptura</b>.</div>';
  }
  h += paso('rup', 5, 'Puntos de ruptura', b);

  /* 6. Cruce con el eje imaginario */
  const Cz = R.cruce;
  b = '<p>Se reemplaza <b>s = jω</b> en D(s) + K·N(s) = 0 y se separa en parte real e imaginaria:</p>';
  b += ec('Re: ' + polyHTML(Cz.Dr, 'ω') + ' + K·(' + polyHTML(Cz.Nr, 'ω') + ') = 0', true);
  b += ec('Im: ' + polyHTML(Cz.Di, 'ω') + ' + K·(' + polyHTML(Cz.Ni, 'ω') + ') = 0', true);
  if (Cz.identico) {
    b += '<div class="res">Las dos ecuaciones son proporcionales para todo ω: el LGR (o un tramo) <b>coincide con el eje imaginario</b>, por eso no hay un único valor crítico.</div>';
  } else {
    b += '<p>Se despeja K de cada una y se igualan, eliminándolo: K = −Re<sub>D</sub>/Re<sub>N</sub> = −Im<sub>D</sub>/Im<sub>N</sub>, de donde</p>';
    b += ec('Im<sub>D</sub>·Re<sub>N</sub> − Re<sub>D</sub>·Im<sub>N</sub> = ' + polyHTML(Cz.Q, 'ω') + ' = 0', true);
    if (!Cz.filas.length) b += '<div class="res no-res">Ninguna raíz de ω es real: <b>no existe ω crítico</b> ni K crítico. El LGR no atraviesa el eje imaginario.</div>';
    else {
      b += '<p>Raíces reales (se listan ω ≥ 0; −ω es simétrica) y el K que cada una exige, reemplazando en la ecuación:</p>';
      b += '<table class="t"><tr><th>ω (rad/s)</th><th>K</th><th>¿Sirve?</th></tr>' + Cz.filas.map(f =>
        '<tr><td>±' + fnum(f.w) + '</td><td>' + fnum(f.K) + '</td><td class="' + (f.valido ? 'si' : 'no') + '">' + (f.valido ? 'Sí · K &gt; 0' : 'No · ' + f.nota) + '</td></tr>').join('') + '</table>';
      const ok = Cz.filas.filter(f => f.valido);
      b += ok.length ? '<div class="res">' + ok.map(f => 'ω<sub>c</sub> = ±' + fnum(f.w) + ' rad/s &nbsp;·&nbsp; K<sub>c</sub> = ' + fnum(f.K)).join('<br>') + '</div>'
        : '<div class="res no-res">Los valores de ω obtenidos exigen K ≤ 0, que no pertenece al LGR (K &gt; 0): <b>no existe ω crítico ni K crítico válidos</b>. El LGR no atraviesa el eje imaginario.</div>';
    }
  }
  h += paso('cru', 6, 'ω crítico y K crítico', b);

  /* 7. Ángulos de salida y llegada */
  if (!R.angulos.length) b = '<div class="res no-res">No hay polos ni ceros complejos: no corresponde calcular ángulos de salida ni de llegada.</div>';
  else {
    b = '<p>Se mide, desde la singularidad compleja, el ángulo del vector que la une con cada una de las demás singularidades.</p>';
    b += ec('θ<sub>salida</sub> = 180° − Σ ∠(polo − otros polos) + Σ ∠(polo − ceros)', true);
    b += ec('φ<sub>llegada</sub> = 180° + Σ ∠(cero − polos) − Σ ∠(cero − otros ceros)', true);
    R.angulos.forEach(a => {
      const sal = a.tipo === 'salida', mult = a.g.mult;
      b += '<p><b>' + (sal ? 'Salida desde el polo ' : 'Llegada al cero ') + fcomp(a.g.z) + (mult > 1 ? ' (×' + mult + ')' : '') + '</b></p>';
      b += '<table class="t"><tr><th>Desde</th><th>Vector</th><th>Ángulo</th></tr>' + a.terminos.map(t =>
        '<tr><td>' + (t.tipo === 'polo' ? 'polo ' : 'cero ') + fcomp(t.de.z) + (t.de.mult > 1 ? ' <small>(×' + t.de.mult + ')</small>' : '') + '</td><td>' + fcomp(t.v, 3) + '</td><td>' + fang(t.ang) + '</td></tr>').join('') + '</table>';
      const sP = fnum(a.sP, 2), sC = fnum(a.sC, 2);
      const pol = sal ? '180° − ' + sP + '° + ' + sC + '°' : '180° + ' + sP + '° − ' + sC + '°';
      b += ec((sal ? 'θ' : 'φ') + ' = ' + pol + ' = ' + fnum(sal ? 180 - a.sP + a.sC : 180 + a.sP - a.sC, 2) + '°' + (mult > 1 ? ' (se divide por la multiplicidad ' + mult + ')' : ''), true);
      b += '<div class="res">' + (sal ? 'θ' : 'φ') + ' = ' + a.vals.map(v => '<b>' + fang(v) + '</b>').join(' ; ') + '</div>';
    });
    b += '<p>Los ángulos de un par conjugado son opuestos entre sí (θ y −θ): sirven de verificación.</p>';
  }
  h += paso('ang', 7, 'Ángulos de salida y de llegada', b);

  /* 8. Conclusión */
  b = '<p>Con ω<sub>c</sub> y K<sub>c</sub> se sabe en qué valores de K los polos de lazo cerrado cruzan el eje imaginario:</p>';
  if (!R.crit.length) {
    b += '<div class="res">El LGR no atraviesa el eje imaginario para K &gt; 0, así que <b>los polos de lazo cerrado no cambian de semiplano</b>.</div>';
  }
  b += '<table class="t"><tr><th>Rango de K</th><th>Polos en el semiplano derecho</th><th>Sistema</th></tr>' + R.tramos.map(t =>
    '<tr><td>' + (t.a === 0 ? '0 &lt; K' : fnum(t.a) + ' &lt; K') + (isFinite(t.b) ? ' &lt; ' + fnum(t.b) : '') + '</td><td>' + t.spd + '</td><td class="' + (t.spd === 0 && !t.eje ? 'si' : 'no') + '">' + (t.spd === 0 ? (t.eje ? 'marginal' : 'estable') : 'inestable') + '</td></tr>').join('') + '</table>';
  const t0 = R.tramos[0], tN = R.tramos[R.tramos.length - 1];
  if (R.crit.length) b += '<div class="res">Los polos de lazo cerrado cruzan el eje imaginario en K = ' + R.crit.map(fnum).join(' ; ') + '. ' +
    (t0.spd === 0 && tN.spd > 0 ? 'El sistema es estable para K &lt; ' + fnum(R.crit[0]) + ' e inestable para K mayor.' : t0.spd > 0 && tN.spd === 0 ? 'El sistema es inestable para K pequeños y se estabiliza al superar K = ' + fnum(R.crit[R.crit.length - 1]) + '.' : 'La estabilidad cambia al cruzar esos valores de K.') + '</div>';
  else b += '<div class="res ' + (t0.spd === 0 ? '' : 'no-res') + '">' + (t0.spd === 0 ? 'Todos los polos de lazo cerrado quedan en el semiplano izquierdo para cualquier K &gt; 0: el sistema es <b>estable para todo K</b>.' : 'Hay ' + t0.spd + ' polo(s) en el semiplano derecho y no cruzan el eje: el sistema es <b>inestable para todo K &gt; 0</b>.') + '</div>';
  h += paso('con', 8, 'Conclusión sobre los polos de lazo cerrado', b);

  /* 9. Comandos equivalentes */
  const num = v => (+v.toFixed(10)).toString();
  const ml = z => Math.abs(z.im) < 1e-12 ? num(z.re) : num(z.re) + (z.im < 0 ? '-' : '+') + num(Math.abs(z.im)) + 'i';
  const sl = z => Math.abs(z.im) < 1e-12 ? num(z.re) : num(z.re) + (z.im < 0 ? '-' : '+') + num(Math.abs(z.im)) + '*%i';
  const vec = (p, f = num) => '[' + p.map(f).join(' ') + ']';
  let mat, sci;
  if (R.modo === 'zp') {
    const zc = expandir(R.ceros), pl = expandir(R.polos);
    mat = 'ceros = [' + zc.map(ml).join(' ') + "]';\npolos = [" + pl.map(ml).join(' ') + '];\n[NUM,DEN] = zp2tf(ceros,polos,1)\nsys = tf(NUM,DEN)\nrlocus(NUM,DEN)\n';
    sci = "s = poly(0,'s');\nceros = [" + zc.map(sl).join(' ') + '];\npolos = [' + pl.map(sl).join(' ') + '];\n' + (zc.length ? "sis = poly(ceros,'s','roots') / poly(polos,'s','roots')" : "sis = 1 / poly(polos,'s','roots')") + '\nevans(sis)\n[k,w] = kpure(sis)\n';
  } else {
    mat = 'NUM = ' + vec(R.N) + ';\nDEN = ' + vec(R.D) + ';\nceros = roots(NUM)\npolos = roots(DEN)\nrlocus(NUM,DEN)\n';
    sci = "s = poly(0,'s');\nnum = poly(" + vec(R.N.slice().reverse()) + ",'s','coeff');\nden = poly(" + vec(R.D.slice().reverse()) + ",'s','coeff');\nsis = num/den\nroots(num)\nroots(den)\nevans(sis)\n[k,w] = kpure(sis)\n";
  }
  mat += '% asíntotas\nn = ' + R.n + '; m = ' + R.m + ';\nang = 180*(2*(0:n-m-1)+1)/(n-m)\nsigma = (sum(polos)-sum(ceros))/(n-m)\n';
  mat += '% puntos de ruptura: K = -D/N\n[dn,dd] = polyder(-DEN,NUM);\nroots(dn)\n';
  b = '<p>Para comprobar con el software de la cátedra:</p><p><b>MatLab</b></p><pre class="cod">' + esc(mat) + '</pre><p><b>SciLab</b></p><pre class="cod">' + esc(sci) + '</pre>';
  h += paso('cmd', 9, 'Comandos equivalentes (MatLab / SciLab)', b);

  el.innerHTML = h;
}

/* =====================================================================
   BARRA, MODOS, EJEMPLOS, EXPORTACIÓN
   ===================================================================== */
function pasarAInputs() {
  $('i-N').value = S.N; $('i-D').value = S.D; $('i-Z').value = S.Z; $('i-P').value = S.P;
  $('m-ec').classList.toggle('on', S.modo === 'ec');
  $('m-zp').classList.toggle('on', S.modo === 'zp');
  $('f-ec').hidden = S.modo !== 'ec';
  $('f-zp').hidden = S.modo !== 'zp';
  [['asint', 'v-asint'], ['vals', 'v-vals'], ['flechas', 'v-flechas'], ['grid', 'v-grid']].forEach(([k, id]) => $(id).classList.toggle('on', !!S.ver[k]));
}
let t = null;
function diferir() { clearTimeout(t); t = setTimeout(calcular, 250); }
[['i-N', 'N'], ['i-D', 'D'], ['i-Z', 'Z'], ['i-P', 'P']].forEach(([id, k]) => {
  $(id).addEventListener('input', e => { S[k] = e.target.value; diferir(); });
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(t); calcular(); } });
});
function modo(m) { S.modo = m; pasarAInputs(); calcular(); }
$('m-ec').onclick = () => modo('ec');
$('m-zp').onclick = () => modo('zp');

(function llenarEjemplos() {
  const sel = $('ejemplos');
  sel.innerHTML = '<option value="">Ejemplos…</option>';
  let grupo = null, og = null;
  EJEMPLOS.forEach((e, i) => {
    if (e.g !== grupo) { og = document.createElement('optgroup'); og.label = e.g; sel.appendChild(og); grupo = e.g; }
    const op = document.createElement('option'); op.value = i; op.textContent = e.t; og.appendChild(op);
  });
  sel.onchange = () => {
    const e = EJEMPLOS[+sel.value];
    if (!e) return;
    S.modo = e.modo;
    if (e.modo === 'ec') { S.N = e.N; S.D = e.D; } else { S.Z = e.Z; S.P = e.P; }
    pasarAInputs(); calcular();
    sel.value = '';
  };
})();

[['asint', 'v-asint'], ['vals', 'v-vals'], ['flechas', 'v-flechas'], ['grid', 'v-grid']].forEach(([k, id]) => {
  $(id).onclick = () => { S.ver[k] = !S.ver[k]; pasarAInputs(); guardar(); dibujar(); };
});
$('b-ajustar').onclick = () => { ajustarVista(); dibujar(); };
$('b-det').onclick = () => { const a = $('detalles'); a.classList.toggle('collapsed'); $('b-det').classList.toggle('on', !a.classList.contains('collapsed')); setTimeout(dibujar, 230); };
$('d-abrir').onclick = () => document.querySelectorAll('details.paso').forEach(d => d.open = true);
$('d-cerrar').onclick = () => document.querySelectorAll('details.paso').forEach(d => d.open = false);
document.querySelectorAll('.glab').forEach(g => g.addEventListener('click', () => g.parentElement.classList.toggle('collapsed')));

function descargar(nombre, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function svgExportado() {
  const W = stage.clientWidth, H = stage.clientHeight;
  return '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<rect width="' + W + '" height="' + H + '" fill="#ffffff"/>' + svg.innerHTML + '</svg>';
}
$('e-svg').onclick = () => { if (Rg) descargar('lgr.svg', new Blob([svgExportado()], { type: 'image/svg+xml' })); };
$('e-png').onclick = () => {
  if (!Rg) return;
  const W = stage.clientWidth, H = stage.clientHeight, img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;
    const g = c.getContext('2d'); g.scale(2, 2); g.drawImage(img, 0, 0, W, H);
    c.toBlob(b => descargar('lgr.png', b), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgExportado());
};

/* ---------- arranque ---------- */
cargar();
pasarAInputs();
if (innerWidth <= 820) { $('detalles').classList.add('collapsed'); $('b-det').classList.remove('on'); }
calcular();
</script>
</body>
