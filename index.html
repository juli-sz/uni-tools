<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simuladores</title>

<!-- ==========================================================
     ESTILOS
     Los colores están todos acá arriba: cambiá estos valores
     y se actualiza toda la página.
     ========================================================== -->
<style>
:root{
  --texto:       #12181f;   /* color del texto principal   */
  --texto-suave: #5b6875;   /* color de las descripciones  */
  --fondo:       #f2f5f8;   /* fondo de la página          */
  --tarjeta:     #ffffff;   /* fondo de los botones        */
  --borde:       #d7dee6;   /* borde de los botones        */
  --acento:      #0d5bd6;   /* color al pasar el mouse     */
}

body{
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 40px 20px;
  background: var(--fondo);
  color: var(--texto);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

h1{
  margin: 0;
  font-size: 26px;
  letter-spacing: -0.02em;
}

p.bajada{
  margin: 0 0 18px;
  color: var(--texto-suave);
  font-size: 14px;
}

/* Cada botón es un enlace <a> con esta clase */
a.boton{
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 12px;
  text-decoration: none;
  color: inherit;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}

a.boton:hover{
  border-color: var(--acento);
  box-shadow: 0 6px 20px rgba(13, 91, 214, .12);
  transform: translateY(-2px);
}

a.boton .icono{
  width: 44px;
  height: 44px;
  flex: none;
  stroke: var(--texto);
  fill: none;
  stroke-width: 1.6;
}

a.boton:hover .icono{ stroke: var(--acento); }

a.boton .titulo{
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 3px;
}

a.boton .desc{
  font-size: 13px;
  color: var(--texto-suave);
}

a.boton .flecha{
  margin-left: auto;
  font-size: 20px;
  color: var(--acento);
}
</style>
</head>

<body>

  <h1>Simuladores</h1>
  <p class="bajada">Elegí con cuál querés trabajar</p>

  <!-- ==========================================================
       BOTÓN 1 — Diagramas de bloques
       El href es el archivo al que va cuando hacés clic.
       ========================================================== -->
  <a class="boton" href="editor-bloques.html">
    <svg class="icono" viewBox="0 0 48 48">
      <rect x="17" y="17" width="20" height="14"/>
      <path d="M2 24h15M37 24h9"/>
      <path d="M13 20l4 4-4 4"/>
    </svg>
    <span>
      <span class="titulo">Diagramas de bloques</span>
      <span class="desc">Bloques con ecuaciones, sumadores y flechas automáticas</span>
    </span>
    <span class="flecha">&rarr;</span>
  </a>

  <!-- ==========================================================
       BOTÓN 2 — Circuitos lógicos
       ========================================================== -->
  <a class="boton" href="simulador-logico.html">
    <svg class="icono" viewBox="0 0 48 48">
      <path d="M16 14h12a10 10 0 010 20H16z"/>
      <path d="M2 20h14M2 28h14M38 24h8"/>
    </svg>
    <span>
      <span class="titulo">Circuitos lógicos</span>
      <span class="desc">Compuertas, biestables y tablas de verdad</span>
    </span>
    <span class="flecha">&rarr;</span>
  </a>

  <!-- ==========================================================
       PARA AGREGAR OTRO SIMULADOR:
       copiá uno de los bloques <a class="boton"> ... </a> de arriba,
       pegalo acá abajo y cambiale tres cosas:
         1. el href      -> el nombre del archivo .html
         2. el titulo    -> cómo se llama
         3. la desc      -> una línea explicando qué hace
       ========================================================== -->

</body>
</html>
